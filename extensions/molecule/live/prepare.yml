---
- name: Prepare isolated live DNS fixtures
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Allocate and seed exact test identities
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/tests/live_acceptance.py"
          - prepare
          - >-
            {{ lookup('ansible.builtin.env', 'GANDI_LIVEDNS_TEST_MANIFEST') |
               default(lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/.cache/gandi-live/run.json', true) }}
      changed_when: false
