---
- name: Verify isolated Supabase fixtures
  hosts: localhost
  gather_facts: false
  vars:
    supabase_live_manifest: >-
      {{ lookup('ansible.builtin.env', 'SUPABASE_TEST_MANIFEST') |
         default(lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/.cache/supabase-live/run.json', true) }}
  tasks:
    - name: Verify only exact test-owned resource identities
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/tests/live_supabase_acceptance.py"
          - verify
          - "{{ supabase_live_manifest }}"
      changed_when: false
      register: supabase_live_verification

    - name: Record the nonsecret acceptance summary and tested versions
      ansible.builtin.debug:
        msg: "{{ supabase_live_verification.stdout }}"
