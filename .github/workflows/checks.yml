---
name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible: ['2.18', '2.19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install 'ansible-core~=${{ matrix.ansible }}.0'
          python scripts/collection_tools.py install
      - name: Lint Ansible content
        run: ansible-lint
      - name: Check Python formatting
        run: black --check tests scripts collections
      - name: Test the installed Collection contract without credentials
        run: pytest -q tests
  linux-installation:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install development tools and local Collections
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/collection_tools.py install
      - name: Predict prerequisite changes without installation
        run: ansible-playbook tests/playbooks/prerequisites.yml -i localhost, -c local --check
      - name: Provision prerequisites on a clean Debian host
        run: ansible-playbook tests/playbooks/prerequisites.yml -i localhost, -c local
      - name: Prove prerequisite idempotence
        run: |
          ansible-playbook tests/playbooks/prerequisites.yml -i localhost, -c local > /tmp/prerequisites-repeat.log
          cat /tmp/prerequisites-repeat.log
          python scripts/assert_no_changes.py /tmp/prerequisites-repeat.log
      - name: Smoke-test latest Vercel CLI without credentials
        run: npx --yes vercel@latest --version
  macos-runtime:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools and local Collections
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/collection_tools.py install
      - name: Exercise public prerequisite Roles on macOS
        run: ansible-playbook tests/playbooks/prerequisites.yml -i localhost, -c local
