---
name: Supabase acceptance
on:
  workflow_dispatch:
    inputs:
      inspect_run_id:
        description: Inspect a failed run's exact ownership manifest without mutations
        required: false
        type: string
      recovery_project_ref:
        description: Operator-confirmed exact Project ref to delete from the inspected manifest before a new live run
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: supabase-acceptance
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: supabase-test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
      SUPABASE_TEST_SMTP_PASS: ${{ secrets.SUPABASE_TEST_SMTP_PASS }}
      SUPABASE_TEST_ORGANIZATION: ${{ vars.SUPABASE_TEST_ORGANIZATION }}
      SUPABASE_TEST_REGION: ${{ vars.SUPABASE_TEST_REGION }}
      MOLECULE_GLOB: extensions/molecule/*/molecule.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install tooling and provider Collections
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/collection_tools.py install
      - name: Inspect retained ownership evidence
        if: inputs.inspect_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RUN_ID: ${{ inputs.inspect_run_id }}
        run: |
          gh run download "$INSPECT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name supabase-live-cleanup-manifest --dir .cache/supabase-inspection
          PYTHONPATH=tests python - <<'PYTHON'
          import json
          from pathlib import Path
          import live_supabase_acceptance as live
          manifest = json.loads(Path('.cache/supabase-inspection/run.json').read_text())
          for name in manifest['projects']:
              item = live.project(manifest, name)
              report = {'name': name, 'started_ms': manifest['started_ms'], 'expected_ref': manifest['projects'][name]}
              if item is not None:
                  report.update({key: item.get(key) for key in ('id', 'ref', 'created_at', 'inserted_at', 'organization_id')})
                  report['created_ms'] = live.created_ms(item)
                  report['delta_ms'] = report['created_ms'] - manifest['started_ms']
              print(json.dumps(report))
          PYTHON
      - name: Recover the operator-confirmed leftover Project
        if: inputs.inspect_run_id != '' && inputs.recovery_project_ref != ''
        env:
          RECOVERY_PROJECT_REF: ${{ inputs.recovery_project_ref }}
        run: python tests/live_supabase_acceptance.py recover .cache/supabase-inspection/run.json "$RECOVERY_PROJECT_REF"
      - name: Run live acceptance
        if: inputs.inspect_run_id == '' || inputs.recovery_project_ref != ''
        run: molecule test -s supabase
      - name: Retry cleanup of exact test-owned resources
        if: always() && (inputs.inspect_run_id == '' || inputs.recovery_project_ref != '')
        run: molecule cleanup -s supabase
      - name: Retain exact-identity cleanup manifest after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-live-cleanup-manifest
          path: .cache/supabase-live/run.json
          include-hidden-files: true
          if-no-files-found: ignore
