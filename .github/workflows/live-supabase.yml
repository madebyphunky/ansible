---
name: Supabase acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-acceptance
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: supabase-test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
      SUPABASE_TEST_SMTP_PASS: ${{ secrets.SUPABASE_TEST_SMTP_PASS }}
      SUPABASE_TEST_ORGANIZATION: ${{ vars.SUPABASE_TEST_ORGANIZATION }}
      SUPABASE_TEST_REGION: ${{ vars.SUPABASE_TEST_REGION }}
      MOLECULE_GLOB: extensions/molecule/*/molecule.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install tooling and provider Collections
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/collection_tools.py install
      - name: Run live acceptance
        run: molecule test -s supabase
      - name: Retry cleanup of exact test-owned resources
        if: always()
        run: molecule cleanup -s supabase
      - name: Retain exact-identity cleanup manifest after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-live-cleanup-manifest
          path: .cache/supabase-live/run.json
          include-hidden-files: true
          if-no-files-found: ignore
