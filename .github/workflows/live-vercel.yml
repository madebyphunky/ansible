---
name: Vercel and GitHub acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-acceptance
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: vercel-github-test
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      VERCEL_TEST_SCOPE_TYPE: ${{ vars.VERCEL_TEST_SCOPE_TYPE }}
      VERCEL_TEST_SCOPE_ID: ${{ vars.VERCEL_TEST_SCOPE_ID }}
      GITHUB_TEST_OWNER: ${{ vars.GITHUB_TEST_OWNER }}
      MOLECULE_GLOB: extensions/molecule/*/molecule.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install tooling and provider Collections
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/collection_tools.py install
      - name: Run live acceptance
        run: molecule test -s vercel
      - name: Retry cleanup of exact test-owned resources
        if: always()
        run: molecule cleanup -s vercel
      - name: Retain exact-identity cleanup manifest after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-live-cleanup-manifest
          path: .cache/vercel-live/run.json
          include-hidden-files: true
          if-no-files-found: ignore
