---
- name: Install package-repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, python3-apt]
    state: present
    update_cache: true
  become: true

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Install the official GitHub CLI signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  become: true

- name: Configure the signed GitHub CLI package repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main
    filename: madebyphunky-github-cli
    state: present
    update_cache: false
  become: true

- name: Install the official GitHub CLI package
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  become: true

- name: Select the package-managed executable
  ansible.builtin.set_fact:
    _github_cli_installed_path: /usr/bin/gh
