---
- name: Validate and retrieve Supabase credentials
  block:
    - name: Validate inputs before installing prerequisites
      madebyphunky.supabase.operation: &operation_parameters
        operation: credentials
        access_token: "{{ SUPABASE_ACCESS_TOKEN | default(lookup('ansible.builtin.env', 'SUPABASE_ACCESS_TOKEN')) }}"
        project_ref: "{{ supabase_project_ref | default(omit) }}"
        cli_version: "{{ supabase_cli_version }}"
        npx_executable: "{{ nodejs_runtime.npx_path | default(supabase_npx_executable) if supabase_manage_prerequisites else supabase_npx_executable }}"
        node_executable: "{{ nodejs_runtime.node_path | default(supabase_node_executable) if supabase_manage_prerequisites else supabase_node_executable }}"
        timeout: "{{ supabase_timeout }}"
        poll_interval: "{{ supabase_poll_interval }}"
      args:
        validate_only: true
      no_log: true
      changed_when: false
      register: _supabase_credentials_operation

    - name: Ensure Node.js and npx are available
      ansible.builtin.include_role:
        name: madebyphunky.nodejs.setup
      when: supabase_manage_prerequisites

    - name: Retrieve hosted Supabase credentials
      madebyphunky.supabase.operation: *operation_parameters
      no_log: true
      register: _supabase_credentials_operation

    - name: Publish Supabase credentials result
      ansible.builtin.set_fact:
        supabase_credentials_result: "{{ _supabase_credentials_operation.result }}"
      no_log: true
  rescue:
    - name: Preserve partial Supabase credentials result
      ansible.builtin.set_fact:
        supabase_credentials_result: "{{ _supabase_credentials_operation.result | default({}) }}"
      no_log: true

    - name: Report Supabase credentials failure
      ansible.builtin.fail:
        msg: >-
          {{ _supabase_credentials_operation.msg |
              default('Supabase prerequisite setup failed; see failing task') }}
