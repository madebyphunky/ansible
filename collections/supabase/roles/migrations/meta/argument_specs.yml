---
argument_specs:
  main:
    short_description: Manage hosted Supabase migrations.
    options:
      SUPABASE_ACCESS_TOKEN:
        type: str
        no_log: true
        description: Access token; falls back to the controller environment of the same name.
      supabase_cli_version:
        type: str
        description: npm Supabase CLI version or tag; defaults to latest.
      supabase_manage_prerequisites:
        type: bool
        description: Ensure Node.js and npx through the Node.js setup Role.
      supabase_npx_executable:
        type: str
        description: npx executable when prerequisites are caller-managed.
      supabase_node_executable:
        type: str
        description: Node executable when prerequisites are caller-managed.
      supabase_timeout:
        type: int
        description: Operation timeout in seconds; defaults to 900.
      supabase_poll_interval:
        type: int
        description: Project readiness polling interval in seconds; defaults to 5.
      supabase_project_ref:
        type: str
        required: true
        description: Explicit Project reference.
      SUPABASE_DB_PASSWORD:
        type: str
        no_log: true
        description: Database password; falls back to the controller environment of the same name.
      supabase_workdir:
        type: path
        required: true
        description: Application checkout containing supabase/migrations.
