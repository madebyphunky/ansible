---
- name: Compose hosted Supabase infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  # Supply organization/name/region, auth config path, application workdir, and
  # tokens through inventory, extra vars, or the documented environment names.
  tasks:
    - name: Ensure the hosted Project
      ansible.builtin.include_role:
        name: madebyphunky.supabase.project

    - name: Select the Project for subsequent Roles
      ansible.builtin.set_fact:
        supabase_project_ref: "{{ supabase_project_result.project.ref }}"
      when: not ansible_check_mode

    - name: Configure Auth
      ansible.builtin.include_role:
        name: madebyphunky.supabase.auth
      when: not ansible_check_mode

    # Preserve the official CLI credential variable shared by all Supabase Roles.
    - name: Use the new initial password for this run's migrations # noqa var-naming[pattern]
      ansible.builtin.set_fact:
        SUPABASE_DB_PASSWORD: "{{ supabase_project_initial_password }}"
      no_log: true
      when:
        - not ansible_check_mode
        - supabase_project_initial_password | default('') | length > 0

    - name: Apply application migrations
      ansible.builtin.include_role:
        name: madebyphunky.supabase.migrations
      when: not ansible_check_mode
